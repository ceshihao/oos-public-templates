FormatVersion: OOS-2019-06-01
Description:
  en: Enable PostgreSQL log_duration without restart. Change only this parameter and verify the running value. Skip
    if already enabled.
  zh-cn: 开启RDS PostgreSQL的语句执行时长日志参数log_duration，不重启实例且不修改其他参数；已开启则跳过，并等待读回运行值生效。
  name-en: ACS-RDS-EnablePostgreSQLLogDuration
  name-zh-cn: 开启RDS PostgreSQL语句执行时长日志
  categories:
    - security
    - rds
Parameters:
  regionId:
    AssociationProperty: RegionId
    Type: String
    Default: '{{ ACS::RegionId }}'
    Label:
      en: RegionId
      zh-cn: 地域ID
  targets:
    Type: Json
    Label:
      en: TargetInstance
      zh-cn: 目标实例
    AssociationProperty: Targets
    AssociationPropertyMetadata:
      ResourceType: ALIYUN::RDS::Instance
      RegionId: regionId
    Default:
      Type: ResourceIds
      ResourceIds: []
      RegionId: '{{ regionId }}'
  OOSAssumeRole:
    Type: String
    Default: ''
    Label:
      en: OOSAssumeRole
      zh-cn: OOS执行使用的RAM角色名称
  rateControl:
    Type: Json
    Label:
      en: RateControl
      zh-cn: 任务执行的并发控制
    AssociationProperty: RateControl
    Default:
      Mode: Concurrency
      MaxErrors: 0
      Concurrency: 1
RamRole: '{{ OOSAssumeRole }}'
Tasks:
  - Name: getInstances
    Action: ACS::SelectTargets
    Description:
      en: Select target instances
      zh-cn: 选择目标实例
    Properties:
      ResourceType: ALIYUN::RDS::Instance
      RegionId: '{{ regionId }}'
      Filters:
        - '{{ targets }}'
    Outputs:
      instanceIds:
        Type: List
        ValueSelector: Instances.Instance[].InstanceId
  - Name: remediateInstances
    Action: ACS::RDS::EnablePostgreSQLLogDuration
    Description:
      en: Validate the selected target count and run the full remediation workflow
      zh-cn: 校验所选目标数量并执行完整的修正流程
    Properties:
      regionId: '{{ regionId }}'
      instanceId: '{{ ACS::TaskLoopItem }}'
    Loop:
      Items:
        Fn::Jq:
          - All
          - if length > 0 then .[] else error("ExpectedNonEmptyTargets") end
          - '{{ getInstances.instanceIds }}'
      RateControl: '{{ rateControl }}'
Outputs:
  instanceIds:
    Type: List
    Value: '{{ getInstances.instanceIds }}'

