FormatVersion: OOS-2019-06-01
Description:
  en: Use this template to install the observability collection component LoongCollector (formerly Logtail) in batches on ECS.
  zh-cn: 使用这个模板批量的在ECS安装可观测采集组件 LoongCollector（原 Logtail）
  name-en: ACS-LOG-BulkyInstallLogtail
  name-zh-cn: 批量安装可观测采集组件 LoongCollector（原 Logtail）
  categories:
    - run_command
Parameters:
  regionId:
    Type: String
    Label:
      en: RegionId
      zh-cn: 地域ID
    AssociationProperty: RegionId
    Default: '{{ ACS::RegionId }}'
  action:
    Type: String
    Label:
      en: Action
      zh-cn: 操作类型
    AllowedValues:
      - install
      - upgrade
      - uninstall
    Default: install
  version:
    Type: String
    Description:
      en: Installed agent version. Effective for Linux (both Logtail and LoongCollector) and Windows LoongCollector. Windows Logtail always installs the latest version
      zh-cn: 安装的Agent版本。对 Linux（Logtail 和 LoongCollector）及 Windows LoongCollector 生效，Windows Logtail 始终安装最新版本
    Label:
      en: Installed agent version
      zh-cn: 安装的Agent版本
    Default: latest
    AllowedPattern: (^latest$)|(^\d+\.\d+\.\d+\.\d+$)|(^\d+\.\d+\.\d+$)
    ConstraintDescription:
      en: 'Invalid version format. Note: on Windows instances with agentType Logtail, this parameter is ignored and the latest version is always installed.'
      zh-cn: '版本格式错误。注意：Windows 实例且 agentType 为 Logtail 时，此参数不生效，始终安装最新版本。'
  agentType:
    Type: String
    Description:
      en: Installed agent type, effective for both Linux and Windows systems
      zh-cn: 安装的Agent类型，对 Linux 和 Windows 系统均生效
    Label:
      en: Installed agent type
      zh-cn: 安装的Agent类型
    AllowedValues:
      - LoongCollector
      - Logtail
    Default: LoongCollector
  ossUrl:
    Type: String
    Description:
      en: OSS download URL. If provided, will be used to build the download address of the Logtail or LoongCollector binary package
      zh-cn: OSS下载地址。如果提供，将用于构建 Logtail 或者 LoongCollector 二进制包的下载地址
    Label:
      en: OSS Download URL
      zh-cn: OSS下载地址
    Default: ''
    AllowedPattern: '^(https?://.+)?$'
    ConstraintDescription:
      en: 'ossUrl must be empty or start with http:// or https://.'
      zh-cn: 'ossUrl 必须为空，或以 http:// 或 https:// 开头。'
  targets:
    Type: Json
    Label:
      en: TargetInstance
      zh-cn: 目标实例
    AssociationProperty: Targets
    AssociationPropertyMetadata:
      ResourceType: ALIYUN::ECS::Instance
      RegionId: regionId
  rateControl:
    Label:
      en: RateControl
      zh-cn: 任务执行的并发比率
    Type: Json
    AssociationProperty: RateControl
    Default:
      Mode: Concurrency
      MaxErrors: 0
      Concurrency: 10
  OOSAssumeRole:
    Label:
      en: OOSAssumeRole
      zh-cn: OOS扮演的RAM角色
    Type: String
    Default: ''
RamRole: '{{ OOSAssumeRole }}'
Tasks:
  - Name: getInstance
    Description:
      en: Views the ECS instances
      zh-cn: 获取ECS实例
    Action: ACS::SelectTargets
    Properties:
      ResourceType: ALIYUN::ECS::Instance
      RegionId: '{{ regionId }}'
      Filters:
        - '{{ targets }}'
    Outputs:
      instanceIds:
        Type: List
        ValueSelector: Instances.Instance[].InstanceId
      instanceInfos:
        Type: List
        ValueSelector: .Instances.Instance[] | {"osType":.OSType, "instanceId":.InstanceId}
  - Name: invokeCommand
    Action: ACS::ECS::InvokeCommand
    Properties:
      instanceId: '{{ ACS::TaskLoopItem }}'
      regionId: '{{ regionId }}'
      parameters:
        regionid: '{{ regionId }}'
        action: '{{ action }}'
        agentType: '{{agentType}}'
        version: '{{version}}'
        ossUrl: '{{ossUrl}}'
      commandId:
        Fn::If:
          - Fn::Equals:
              - Fn::Jq:
                  - First
                  - .|map(select(.instanceId == "{{ ACS::TaskLoopItem }}").osType)[]
                  - '{{ getInstance.instanceInfos }}'
              - linux
          - ACS-LOG-InstallLogtail-for-linux.sh
          - ACS-LOG-InstallLogtail-for-windows.ps1
    Outputs:
      commandOutput:
        Type: String
        ValueSelector: invocationOutput
    Loop:
      Items: '{{ getInstance.instanceIds }}'
      RateControl: '{{ rateControl }}'
      Outputs:
        commandOutputs:
          AggregateType: Fn::ListJoin
          AggregateField: commandOutput
Outputs:
  commandOutput:
    Type: String
    Value: '{{ invokeCommand.commandOutputs }}'
Metadata:
  ALIYUN::OOS::Interface:
    ParameterGroups:
      - Parameters:
          - action
          - agentType
          - version
          - ossUrl
        Label:
          default:
            zh-cn: 设置参数
            en: Configure Parameters
      - Parameters:
          - regionId
          - targets
        Label:
          default:
            zh-cn: 选择实例
            en: Select Ecs Instances
      - Parameters:
          - rateControl
          - OOSAssumeRole
        Label:
          default:
            zh-cn: 高级选项
            en: Control Options

